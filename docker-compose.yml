# Local development services. Start with: docker compose up -d
# Credentials come from the repo-root .env file (copy .env.example to .env first).

services:
  postgres:
    image: pgvector/pgvector:pg16  # Postgres 16 with the pgvector extension available
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # data survives container restarts
    healthcheck:
      # $$ means "use the variable inside the container", not on the host.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

# Runs before every commit. Install once with: cd backend ; uv run pre-commit install
# Hooks use the project's own tool versions (from uv.lock), so they match CI exactly.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy src tests scripts
        language: system
        types: [python]
        pass_filenames: false
